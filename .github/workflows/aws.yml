name: Deploy to Amazon ECS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: manage-web
  ECS_SERVICE: dupli1-manage-web
  ECS_CLUSTER: production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IAM role trust policy must include repo:elug3/dupli1-manage-web:ref:refs/heads/master
      # (and dupli1-web for the storefront) after the schick → dupli1 rename.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845061289093:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          APP_VERSION: ${{ steps.pkg.outputs.version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --build-arg "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" \
            --build-arg "APP_GIT_SHA=$APP_GIT_SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:v$APP_VERSION-b$APP_BUILD_NUMBER" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:v$APP_VERSION-b$APP_BUILD_NUMBER"
          # latest is what the Terraform-managed task definition points at
          # (dupli1 infra/terraform/ecs_frontends.tf). The deploy below re-pulls
          # it; the two tags above stay for identifying and rolling back to a
          # specific build.
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # The task definition belongs to Terraform (dupli1
      # infra/terraform/ecs_frontends.tf, aws_ecs_task_definition.manage_web).
      # This repo used to render and deploy its own .aws/task-definition.json,
      # which declared a second family and a FARGATE launch type for the same
      # service — two systems owning one service, whichever ran last winning.
      # Now the pipeline only supplies the image and asks ECS to re-pull it,
      # the same way the backend services deploy.
      - name: Force ECS service redeployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --no-cli-pager
