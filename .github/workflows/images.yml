name: Image

# Publishes the admin image to GHCR and deploys it to VENUS. Pull requests are
# covered by ci.yml, which already checks the Docker build.
#
#   ghcr.io/elug3/dupli1-manage-web:sha-<short>   every published build
#   ghcr.io/elug3/dupli1-manage-web:master        latest master
#
# The deploy job runs on the self-hosted runner on VENUS (label "venus") and
# calls deploy.sh from the backend repo's deploy checkout; see
# elug3/dupli1 docs/deployment-venus.md → "Deploying new code".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build dupli1-manage-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dupli1-manage-web
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.pkg.outputs.version }}
            APP_BUILD_NUMBER=${{ github.run_number }}
            APP_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # master pushes only — never pull requests: this repo is public, and fork
  # PRs need maintainer approval before any job runs.
  deploy:
    name: Deploy to VENUS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, venus]
    environment: production
    concurrency:
      group: venus-deploy-manage-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_OWNER: ${{ github.repository_owner }}
        run: /opt/dupli1/repo/deploy/venus/deploy.sh manage-web "sha-${GITHUB_SHA::7}"

      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: rm -rf "$DOCKER_CONFIG"
